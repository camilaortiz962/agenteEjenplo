<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obj1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <button id="btnOscuro">Modo oscuro</button>

  <!-- Panel de filtros (a la izquierda): los botones filtran por "bando" y
       el slider vertical por nivelDeFuerza mínimo. Index.js vuelve a dibujar
       la baraja cada vez que cambia cualquiera de los dos. -->
  <aside class="filtros">
    <div class="filtros-botones" id="filtrosBotones">
      <button class="filtro-btn activo" data-bando="Todos">Todos</button>
      <button class="filtro-btn" data-bando="Grupo">Grupo</button>
      <button class="filtro-btn" data-bando="Líder">Líder</button>
      <button class="filtro-btn" data-bando="Vocalista">Vocalista</button>
      <button class="filtro-btn" data-bando="Rapero">Rapero</button>
      <button class="filtro-btn" data-bando="Bailarín">Bailarín</button>
    </div>

    <label class="filtro-slider" for="sliderFuerza">
      <span>HP mín.</span>
      <input type="range" id="sliderFuerza" min="85" max="100" value="85">
      <span class="filtro-valor" id="valorFuerza">85</span>
    </label>
  </aside>

  <!-- Baraja: Index.js llena esto con una carta (.card) por cada
       integrante, apiladas una sobre otra vía CSS -->
<section class="baraja" id="baraja"></section>

  <!-- Aviso que Index.js muestra cuando ningún personaje cumple los filtros -->
  <p class="baraja-vacia" id="barajaVacia" hidden>Sin cartas con este filtro</p>

  <!-- Botones para rotar cuál carta de la baraja está al frente -->
  <div class="baraja-controles">
    <button id="btnAnterior">‹ Anterior</button>
    <button id="btnSiguiente">Siguiente ›</button>
  </div>

  <!-- Modal de detalle: oculto por defecto (atributo hidden), Index.js lo
       muestra y llena #modalCard al hacer click en una carta de la baraja -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="card modal-card" id="modalCard"></div>
  </div>

  <script src="data.js"></script>
  <script src="cartas.js"></script>
  <script src="Index.js"></script>
</body>
</html>
