<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado 2 — Grid Básico (para completar en clase)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    body.dark-mode {
      background-color: #2c3e50;
      color: #ecf0f1;
    }
    
    .grid-container {
   
      display: grid ;
    
      grid-template-columns: 100px 2fr 1fr;
      
       gap:10px;

        background-color: #ecf0f1;
      padding: 15px;
      border-radius: 8px;

        
      @media (min-width: 500px) {
      .grid-item {
        background-color: black;
        color: white;
        padding: 30px;
        text-align: center;
        font-size: 1.2rem; 
        border-radius: 8px;
        font-weight: bold;
        }
       }
      
       @media (min-width: 700px) {
      .grid-item {
        border-radius: 50px;
        background-color: red; 
        }
       }
       }

       .dark-mode .grid-container {
        background-color: #34495e;
        }

        .dark-mode .grid-item {
          background-color: #1abc9c;    
       }

  @media (min-width: 700px) {
      .grid-item2 {
        display:none;
        }

       }

.grid-container2 {
   
      display: grid ;
    
      grid-template-columns: 100px 2fr 1fr;
      
       gap:10px;

        background-color: #ecf0f1;
      padding: 15px;
      border-radius: 8px;
 }

 
.grid-container3 {
   
      display: grid ;
    
      grid-template-columns: 100px 2fr 1fr;
      
       gap:10px;

        background-color: #ecf0f1;
      padding: 15px;
      border-radius: 8px;
 }

 .grid-container4 {
   
      display: grid ;
    
      grid-template-columns: 100px 2fr 1fr;
      
       gap:10px;

        background-color: #ecf0f1;
      padding: 15px;
      border-radius: 8px;
 }


    .grid-item {
      background-color: #3498db;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }
    .grid-item2 {
      background-color: #ea7ed8;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }
    .grid-item3 {
      background-color: #a263e6;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }

    .grid-item4 {
      background-color: #f39c12;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }
</style>
</head>
<body>
  <h1 id="titulo">Mi Primer Grid</h1>
  <p id="descripcion" style="margin: 20px 0;">Grid con 3 columnas de 200px cada una — completa los TODO del CSS.</p>

  <div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
    <div class="grid-item">5</div>
    <div class="grid-item">6</div>
    <div class="grid-item">7</div>
    <div class="grid-item">8</div>
    <div id="demo"class="grid-item">9</div>
  </div>
  
  <button id="boton">Botón</button>
  <button id="btnOscuro">Dark mode</button>

  <div id="caja2" class="grid-container2">
    <div class="grid-item2">1</div>
    <div class="grid-item2">2</div>
    <div class="grid-item2">3</div>
  </div>

  <div id="caja3" class="grid-container3">
    <div class="grid-item3">1</div>
    <div class="grid-item3">2</div>
    <div class="grid-item3">3</div>
  </div>

   <div class="grid-container4">
    <div class="grid-item4">1</div>
    <div class="grid-item4">2</div>
    <div class="grid-item4">3</div>
  </div>
<button id="btn3" > Desaparece clase </button>
<script>

let txt = document.getElementById("demo");    
let btnMsg = document.getElementById("boton");
btnMsg.addEventListener("click", function() {
  console.log("click en el botón");
  txt.textContent = "Holiiis";
});


// Guardamos una referencia a la caja que queremos esconder/mostrar
let caja3 = document.getElementById("caja3");

// matchMedia crea un "sensor" que sabe si la pantalla cumple esa condición
// (el mismo min-width: 700px que usa .grid-item2 en el CSS)
let mediaQuery700 = window.matchMedia("(min-width: 700px)");

// Esta función decide si mostrar u ocultar caja3 según el sensor:
// e.matches es true cuando el ancho de pantalla es >= 700px
function toggleCaja3(e) {
  caja3.style.display = e.matches ? "none" : "grid";
}

// La llamamos una vez al cargar la página, para que arranque en el estado correcto
toggleCaja3(mediaQuery700);

// Y la dejamos escuchando: cada vez que se cruza el umbral de 700px
// (para arriba o para abajo) el navegador dispara "change" y se vuelve a evaluar
mediaQuery700.addEventListener("change", toggleCaja3);


let btnOscuro = document.getElementById("btnOscuro");

btnOscuro.addEventListener("click", function() {
  console.log("click en el botón");
document.body.classList.toggle("dark-mode");
if (document.body.classList.contains("dark-mode")) {
  btnOscuro.textContent = "Light mode";
} else {
  btnOscuro.textContent = "Dark mode"; }
});


const gc4 = document.querySelector(".grid-container4");
 const btn3 = document.getElementById("btn3")

 btn3.addEventListener("click", function() {
  alert("hola mundo 3");
  gc4.style.display = "none";
  });
  
  const titulo = document.getElementById("titulo");
  const descripcion = document.getElementById("descripcion"); 

  function resize (){
    if (window.innerWidth >= 1024) {
    titulo.textContent = "Modo Desktop";
     descripcion.textContent = "Holiiiis";
    }
     else if(window.innerWidth >= 768) {
      titulo.textContent = "Modo Tablet";
      descripcion.textContent = "Como taaaaaas";
    } else {
      titulo.textContent = "Modo Móvil";
        descripcion.textContent = "Bieeeeeeeeeen";
  }
  }


  window.addEventListener("resize", resize);
  resize(); 
</script>

</body>
</html>
